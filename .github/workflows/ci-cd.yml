name: CI/CD - API maintenance predictive

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Tests automatiques
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Installer les dependances
        run: pip install -r requirements-dev.txt

      - name: Verifier le code (lint)
        run: python -m ruff check app tests

      - name: Lancer les tests
        run: python -m pytest -v

  build:
    name: Build Docker
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construire l'image Docker
        run: docker build -t predictive-maintenance-api:${{ github.sha }} .

      - name: Verifier l'image (health check)
        run: |
          docker run -d --name api-ci -p 8000:8000 predictive-maintenance-api:${{ github.sha }}
          for i in $(seq 1 10); do
            if curl -sf http://localhost:8000/health; then exit 0; fi
            sleep 3
          done
          echo "L'API n'a pas repondu a temps" >&2
          docker logs api-ci
          exit 1
